<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital World - Passport Photo A4</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#17202a}
header{background:#0b57d0;color:#fff;padding:18px 14px;text-align:center}
header h1{margin:0;font-size:27px}
header p{margin:6px 0 0;font-size:14px}
.container{max-width:760px;margin:18px auto;padding:0 12px}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 14px #0001;margin-bottom:16px}
h2{font-size:20px;margin:0 0 14px}
label{font-size:15px;font-weight:bold;display:block;margin-bottom:6px}
input[type=file],select{
  width:100%;padding:12px;border:1px solid #ccd4dd;border-radius:10px;
  font-size:16px;background:#fff
}
button{width:100%;border:0;border-radius:10px;padding:14px 16px;font-size:17px;font-weight:bold;cursor:pointer;margin-top:12px}
.primary{background:#0b57d0;color:#fff}
.secondary{background:#e8eef7;color:#123}
.preview-wrap{overflow:auto;text-align:center;background:#e9edf2;padding:10px;border-radius:12px}
canvas{display:block;margin:auto;width:100%;height:auto;background:#fff}
.status{margin-top:12px;text-align:center;font-weight:bold}
.note{font-size:14px;color:#566;line-height:1.5}
@media(max-width:520px){
  header h1{font-size:23px}
}
@media print{
  @page{size:A4 portrait;margin:0}
  body{background:#fff}
  header,.no-print{display:none!important}
  .container{max-width:none;margin:0;padding:0}
  .print-card{box-shadow:none;padding:0;margin:0}
  .preview-wrap{padding:0;background:#fff}
  canvas{width:210mm!important;height:297mm!important;max-width:none}
}
</style>
</head>
<body>

<header>
  <h1>Digital World</h1>
  <p>Passport Size Photo • A4 Sheet • 6 Copies • HD Print</p>
</header>

<div class="container">

  <div class="card no-print">
    <h2>📷 Passport Photo</h2>

    <label>फोटो चुनें</label>
    <input id="photo" type="file" accept="image/*">

    <div style="margin-top:14px">
      <label>Photo Size</label>
      <select id="size">
        <option value="30x35" selected>30 × 35 mm</option>
        <option value="30x38">30 × 38 mm</option>
      </select>

      <div style="margin-top:14px">
        <label>कॉपी</label>
        <select id="copies">
          <option value="6" selected>6 Photos (एक ही लाइन)</option>
          <option value="12">12 Photos (6 + 6)</option>
        </select>
      </div>
    </div>

    <button class="primary" id="make">A4 Sheet तैयार करें</button>
    <button class="secondary" id="download">⬇️ A4 JPG डाउनलोड करें</button>
    <button class="secondary" id="print">🖨️ Print करें</button>

    <div id="status" class="status"></div>

    <p class="note">
      <b>6 Photos = एक ही लाइन</b> और <b>12 Photos = 6 + 6, दो लाइन</b> रहेंगी। Output A4, 300 DPI HD canvas पर बनेगा।
      Print करते समय <b>Actual Size / 100%</b> रखें और <b>Fit to page</b> बंद रखें।
    </p>
  </div>

  <div class="card print-card">
    <h2 class="no-print">A4 Preview</h2>
    <div class="preview-wrap">
      <!-- A4 at 300 DPI = 2480 × 3508 px -->
      <canvas id="sheet" width="2480" height="3508"></canvas>
    </div>
  </div>

</div>

<script>
const photoInput=document.getElementById('photo');
const size=document.getElementById('size');
const copies=document.getElementById('copies');
const canvas=document.getElementById('sheet');
const ctx=canvas.getContext('2d',{alpha:false});
const status=document.getElementById('status');
let img=null;

function drawEmpty(){
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle='#777';
  ctx.font='42px Arial';
  ctx.textAlign='center';
  ctx.fillText('Digital World',canvas.width/2,canvas.height/2-20);
  ctx.font='26px Arial';
  ctx.fillText('Photo upload करके A4 Sheet तैयार करें',canvas.width/2,canvas.height/2+30);
}
drawEmpty();

photoInput.addEventListener('change',()=>{
  const file=photoInput.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=e=>{
    img=new Image();
    img.onload=()=>makeSheet();
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
});

document.getElementById('make').onclick=()=>{
  if(!img){
    status.textContent='पहले फोटो चुनें।';
    return;
  }
  makeSheet();
};

function makeSheet(){
  ctx.fillStyle='#fff';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  const [mw,mh]=size.value.split('x').map(Number);
  const count=Number(copies.value);

  // 300 DPI: 1 mm = 300 / 25.4 pixels
  const pxPerMm=300/25.4;
  const pw=mw*pxPerMm;
  const ph=mh*pxPerMm;

  // Exactly 6 photos in each horizontal line.
  const gap=4*pxPerMm;
  const totalW=(6*pw)+(5*gap);
  const startX=(canvas.width-totalW)/2;

  // For 6 copies: one line.
  // For 12 copies: two lines, 6 + 6.
  const rows=count===12 ? 2 : 1;
  const rowGap=8*pxPerMm;

  // Keep the photo block neatly near the top of the A4 page.
  const startY=12*pxPerMm;

  for(let i=0;i<count;i++){
    const col=i%6;
    const row=Math.floor(i/6);
    const x=startX+col*(pw+gap);
    const y=startY+row*(ph+rowGap);

    drawCover(img,x,y,pw,ph);

    ctx.strokeStyle='#b8b8b8';
    ctx.lineWidth=1;
    ctx.strokeRect(
      Math.round(x)+0.5,
      Math.round(y)+0.5,
      Math.round(pw),
      Math.round(ph)
    );
  }

  status.textContent='Digital World • A4 • '+count+' copies • '+mw+' × '+mh+' mm';
}

function drawCover(image,x,y,w,h){
  const ir=image.width/image.height;
  const tr=w/h;

  let sx=0,sy=0,sw=image.width,sh=image.height;

  // Crop to exact photo ratio without distortion.
  if(ir>tr){
    sw=image.height*tr;
    sx=(image.width-sw)/2;
  }else{
    sh=image.width/tr;
    sy=(image.height-sh)/2;
  }

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(image,sx,sy,sw,sh,x,y,w,h);
}

size.addEventListener('change',()=>{
  if(img)makeSheet();
});

copies.addEventListener('change',()=>{
  if(img)makeSheet();
});

document.getElementById('download').onclick=()=>{
  if(!img){
    status.textContent='पहले फोटो चुनें।';
    return;
  }
  makeSheet();
  const a=document.createElement('a');
  a.download='Digital-World-6-Photos-A4-300DPI.jpg';
  a.href=canvas.toDataURL('image/jpeg',1.0);
  a.click();
};

document.getElementById('print').onclick=()=>{
  if(!img){
    status.textContent='पहले फोटो चुनें।';
    return;
  }
  makeSheet();
  window.print();
};
</script>

</body>
</html>
